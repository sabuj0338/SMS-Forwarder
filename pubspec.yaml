name: sms_forwarder
description: "Sideload SMS forwarder — reads SMS, queues offline, forwards via API."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  another_telephony: ^0.4.1
  path_provider: ^2.1.5
  http: ^1.2.2
  connectivity_plus: ^6.1.3
  uuid: ^4.5.1
  crypto: ^3.0.6
  intl: ^0.20.2
  flutter_foreground_task: ^8.17.0
  disable_battery_optimization: ^1.1.2
  share_plus: ^10.1.4
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: assets/icon/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
